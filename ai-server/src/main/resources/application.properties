spring.application.name=knot-ai-server
server.address=127.0.0.1
server.port=${AI_PORT:18765}
ai.token=${AI_APP_TOKEN}
ai.work-directory=${AI_WORK_DIRECTORY}
ai.profile-file=${AI_PROFILE_FILE}
ai.runner-directory=${AI_RUNNER_DIRECTORY}
ai.allowed-s3-hosts=${AI_ALLOWED_S3_HOSTS}
ai.download-timeout=${AI_DOWNLOAD_TIMEOUT:15m}
ai.conversion-timeout=${AI_CONVERSION_TIMEOUT:15m}
ai.inference-timeout=${AI_INFERENCE_TIMEOUT:12h}
ai.python=${AI_PYTHON:python3}
ai.pnpm=${AI_PNPM:pnpm}
ai.ffmpeg=${AI_FFMPEG:ffmpeg}
