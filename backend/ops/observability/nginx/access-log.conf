log_format knot_observability escape=json
    '{"time":"$time_iso8601","request_id":"$request_id","node":"$hostname","host":"$host","method":"$request_method",'
    '"uri":"$uri","status":$status,"duration":$request_time,'
    '"upstream_duration":"$upstream_response_time","upstream_addr":"$upstream_addr","upstream_status":"$upstream_status"}';
access_log /var/log/nginx/knot-observability.json knot_observability;
