version: 0.2

phases:
  install:
    runtime-versions:
      java: corretto25

  pre_build:
    commands:
      - chmod +x backend/gradlew
      - ./backend/gradlew -p backend clean

  build:
    commands:
      - ./backend/gradlew -p backend spotlessCheck
      - ./backend/gradlew -p backend test
      - ./backend/gradlew -p backend integrationTest
      - ./backend/gradlew -p backend acceptanceTest
      - ./backend/gradlew -p backend bootJar
      - JAR_FILE=$(find backend/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-plain.jar' | head -n 1)
      - cp "$JAR_FILE" app.jar
      - cp backend/appspec.yml appspec.yml
      - cp -R backend/scripts scripts

artifacts:
  files:
    - app.jar
    - appspec.yml
    - scripts/**/*
    - backend/build/test-results/**/*
    - backend/build/reports/tests/**/*
  discard-paths: no
