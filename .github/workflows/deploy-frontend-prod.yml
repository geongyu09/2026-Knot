name: Frontend Prod CD

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend-prod.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-prod-deployment
  cancel-in-progress: true

env:
  API_BASE_URL: ${{ vars.API_BASE_URL_PROD }}
  POSTHOG_KEY: ${{ vars.POSTHOG_KEY_PROD }}
  # 다른 Sentry 프로젝트로 바꾸면 frontend/src/worker/relay의 Sentry 프로젝트 상수도 함께 바꿔요
  SENTRY_DSN: ${{ vars.SENTRY_DSN }}
  SENTRY_ENVIRONMENT: production
  SENTRY_ORG: ${{ vars.SENTRY_ORG }}
  SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
  SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check API_BASE_URL
        run: |
          if [ -z "$API_BASE_URL" ]; then
            echo "::warning::Repository variable API_BASE_URL_PROD is not set; the bundle will call the API with an undefined base URL."
          fi

      - name: Build
        run: pnpm build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: frontend
          packageManager: pnpm
          environment: prod
